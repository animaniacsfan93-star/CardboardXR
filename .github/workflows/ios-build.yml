name: iOS build

# Builds the iPhone app on GitHub's macOS runner, where Xcode is: Unity exports the Xcode project
# (Builds/iOS) on the runner, and xcodebuild makes an unsigned .ipa to download. Signing it for your
# own iPhone happens on your own computer afterwards; docs/ios-without-a-mac.md walks through it.
#
# Needs, once, in Settings > Secrets and variables > Actions:
#   UNITY_LICENSE   the whole text of the .ulf file from Unity's manual licence activation
#   UNITY_EMAIL     the Unity account's email
#   UNITY_PASSWORD  the Unity account's password
# Unity's activation workflow, which makes the .alf file to upload, is unity-activation.yml here.
# Also enable Actions: a fork starts with them off (Actions > I understand my workflows, go ahead).

# Started by hand (Actions > iOS build > Run workflow), so nothing fails before the licence secrets
# are in place. Add a `push:` trigger under `on:` once it has built once.
on:
  workflow_dispatch:

jobs:
  build:
    name: Unity export, then Xcode
    runs-on: macos-14
    timeout-minutes: 90
    env:
      CARDBOARDXR_BUILD_PATH: Builds/iOS
    steps:
      - uses: actions/checkout@v4
        with:
          # The hand models are several megabytes; keep them as they are.
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-

      # Installs this Unity version with its iOS module, activates the licence, and runs
      # StereoBuilder.BuildIosForCi, which writes the Xcode project to CARDBOARDXR_BUILD_PATH.
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: 6000.6.0f1
          buildMethod: ProjectBootstrap.StereoBuilder.BuildIosForCi
          versioning: None
          allowDirtyBuild: true

      # The repository's own script does the Xcode half. --ipa needs no phone attached and no signing,
      # and writes Builds/CardboardXR-unsigned.ipa, the same file a Mac without the phone would get.
      - name: Xcode builds an unsigned app
        run: zsh Tools/ios_build_and_run.sh --xcode --ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CardboardXR-unsigned-ipa
          path: Builds/CardboardXR-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
